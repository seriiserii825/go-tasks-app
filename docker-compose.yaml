services:
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   env_file: .env
  #   environment:
  #     # внутри сети compose БД доступна по имени сервиса и внутреннему порту
  #     CONN_STR: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  #   ports:
  #     - "${APP_PORT}:${APP_PORT}"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - backend
  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations

  postgres:
    image: "postgres:18.1-bookworm"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # postgres 18+: монтируем /var/lib/postgresql (данные лягут в 18/docker), не /data
      - postgres_data:/var/lib/postgresql
      - ./pg_backups:/pgadmin/backups

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      - postgres

  adminer: # Легче, чем pgAdmin!
    image: adminer
    restart: "no"
    ports:
      - 8000:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette # Красивая тема

volumes:
  postgres_data:
